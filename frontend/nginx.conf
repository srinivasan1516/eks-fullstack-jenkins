server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the static frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API calls to the backend Kubernetes Service.
    # "backend-service" is the Service name/DNS from k8s/backend-service.yaml,
    # resolved automatically by Kubernetes' internal DNS (CoreDNS) since
    # both Services live in the same namespace.
    location /api/ {
        proxy_pass http://backend-service:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
